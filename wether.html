<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #111;

            padding: 20px;
        }

        .weather-app {
            width: 100%;
            max-width: 420px;
            min-height: 650px;

            padding: 32px 20px 30px;

            border-radius: 28px;

            background:
                 linear-gradient(
                  145deg,
                     #19d3c5 0%,
                     #3b82f6 38%,
                     #6d5dfc 68%,
                     #b65cff 100%
                    );
            position: relative;

            overflow: hidden;

            color: white;
        }

        .search-area {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 45px;
        }

        #cityInput {
            flex: 1;

            height: 53px;

            border: none;
            outline: none;

            border-radius: 30px;

            padding: 0 22px;

            font-size: 16px;

            color: #555;

            background: rgba(255, 255, 255, 0.92);
        }

        #cityInput::placeholder {
            color: #777;
        }

        #searchButton {
            width: 53px;
            height: 53px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.9);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        #searchButton:hover {
            transform: scale(1.05);
        }

        .search-icon {
            width: 18px;
            height: 18px;

            border: 2px solid #789090;

            border-radius: 50%;

            position: relative;
        }

        .search-icon::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 2px;

            background: #789090;

            right: -6px;
            bottom: -3px;

            transform: rotate(45deg);

            border-radius: 2px;
        }

        .weather-content {
            text-align: center;
        }

        #weatherIcon {
            width: 150px;
            height: 150px;

            object-fit: contain;

            display: block;

            margin: 0 auto 18px;
        }

        #temperature {
            font-size: 70px;

            font-weight: 400;

            line-height: 1;

            color: white;

            margin-bottom: 20px;
        }

        #city {
            font-size: 39px;

            font-weight: 400;

            color: white;

            margin-bottom: 65px;
        }

        .weather-details {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 15px;
        }

        .detail {
            display: flex;

            align-items: center;

            gap: 10px;

            width: 45%;

            text-align: left;
        }

        .detail-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .detail-icon img {
            width: 32px;
            height: 32px;

            object-fit: contain;
        }

        .detail-text {
            display: flex;

            flex-direction: column;

            gap: 3px;
        }

        .detail-value {
            font-size: 19px;

            color: white;

            font-weight: 400;
        }

        .detail-label {
            font-size: 13px;

            color: rgba(255, 255, 255, 0.9);
        }

        #error {
            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            color: white;

            font-size: 14px;
        }

        #loading {
            text-align: center;

            color: white;

            display: none;

            margin-bottom: 10px;
        }

        @media (max-width: 450px) {

            body {
                padding: 0;
            }

            .weather-app {
                min-height: 100vh;

                border-radius: 0;

                max-width: none;
            }

        }

    </style>

</head>


<body>


    <div class="weather-app">


        <!-- SEARCH -->

        <form class="search-area" id="weatherForm">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city"
                autocomplete="off"
            >

            <button
                type="submit"
                id="searchButton"
                aria-label="Search"
            >

                <span class="search-icon"></span>

            </button>

        </form>


        <p id="loading">
            Loading...
        </p>


        <!-- WEATHER -->

        <div class="weather-content">


            <!-- MAIN WEATHER IMAGE -->

            <img
                id="weatherIcon"
                src="sunny.png"
                alt="Weather"
            >


            <!-- TEMPERATURE -->

            <h1 id="temperature">
                --°C
            </h1>


            <!-- CITY -->

            <h2 id="city">
                Your city
            </h2>


            <!-- HUMIDITY + WIND -->

            <div class="weather-details">


                <!-- HUMIDITY -->

                <div class="detail">

                    <div class="detail-icon">

                        <img
                            src="humidity.png"
                            alt="Humidity"
                        >

                    </div>

                    <div class="detail-text">

                        <span
                            class="detail-value"
                            id="humidity"
                        >
                            --%
                        </span>

                        <span class="detail-label">
                            Humidity
                        </span>

                    </div>

                </div>


                <!-- WIND -->

                <div class="detail">

                    <div class="detail-icon">

                        <img
                            src="wind-speed.png"
                            alt="Wind Speed"
                        >

                    </div>

                    <div class="detail-text">

                        <span
                            class="detail-value"
                            id="wind"
                        >
                            -- km/h
                        </span>

                        <span class="detail-label">
                            Wind Speed
                        </span>

                    </div>

                </div>


            </div>


        </div>


        <p id="error"></p>


    </div>



    <script>

        const form =
            document.getElementById("weatherForm");

        const cityInput =
            document.getElementById("cityInput");

        const city =
            document.getElementById("city");

        const temperature =
            document.getElementById("temperature");

        const humidity =
            document.getElementById("humidity");

        const wind =
            document.getElementById("wind");

        const weatherIcon =
            document.getElementById("weatherIcon");

        const error =
            document.getElementById("error");

        const loading =
            document.getElementById("loading");


        /* =========================
           WEATHER IMAGE SELECTION
        ========================= */

        function getWeatherIcon(code) {

            /* CLEAR */

            if (code === 0) {
                return "sunny.png";
            }


            /* MAINLY CLEAR */

            if (code === 1) {
                return "sunny.png";
            }


            /* PARTLY CLOUDY */

            if (code === 2) {
                return "cloudy.png";
            }


            /* OVERCAST */

            if (code === 3) {
                return "cloudy.png";
            }


            /* FOG */

            if (code === 45 || code === 48) {
                return "foggy.png";
            }


            /* DRIZZLE */

            if (
                code === 51 ||
                code === 53 ||
                code === 55 ||
                code === 56 ||
                code === 57
            ) {
                return "rainy.png";
            }


            /* RAIN */

            if (
                code === 61 ||
                code === 63 ||
                code === 65 ||
                code === 66 ||
                code === 67
            ) {
                return "rainy.png";
            }


            /* RAIN SHOWERS */

            if (
                code === 80 ||
                code === 81 ||
                code === 82
            ) {
                return "rainy.png";
            }


            /* SNOW / FREEZING */

            if (
                code === 71 ||
                code === 73 ||
                code === 75 ||
                code === 77 ||
                code === 85 ||
                code === 86
            ) {
                return "freezing-cold.png";
            }


            /* THUNDERSTORM */

            if (
                code === 95 ||
                code === 96 ||
                code === 99
            ) {
                return "rainy.png";
            }


            /* DEFAULT */

            return "cloudy.png";
        }


        /* =========================
           GET WEATHER
        ========================= */

        async function getWeather(cityName) {

            try {

                error.textContent = "";

                loading.style.display = "block";


                /* FIND CITY */

                const locationResponse = await fetch(

                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`

                );


                if (!locationResponse.ok) {

                    throw new Error(
                        "Location request failed"
                    );

                }


                const locationData =
                    await locationResponse.json();


                if (
                    !locationData.results ||
                    locationData.results.length === 0
                ) {

                    throw new Error(
                        "City not found"
                    );

                }


                const location =
                    locationData.results[0];


                /* GET WEATHER */

                const weatherResponse = await fetch(

                    `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`

                );


                if (!weatherResponse.ok) {

                    throw new Error(
                        "Weather request failed"
                    );

                }


                const weatherData =
                    await weatherResponse.json();


                const current =
                    weatherData.current;


                /* SHOW CITY */

                city.textContent =
                    location.name;


                /* SHOW TEMPERATURE */

                temperature.textContent =
                    Math.round(
                        current.temperature_2m
                    ) + "°C";


                /* SHOW HUMIDITY */

                humidity.textContent =
                    current.relative_humidity_2m
                    + "%";


                /* SHOW WIND */

                wind.textContent =
                    Math.round(
                        current.wind_speed_10m
                    ) + " km/h";


                /* SHOW CORRECT IMAGE */

                weatherIcon.src =
                    getWeatherIcon(
                        current.weather_code
                    );

            }


            catch (err) {

                console.error(err);

                city.textContent =
                    "City not found";

                temperature.textContent =
                    "--°C";

                humidity.textContent =
                    "--%";

                wind.textContent =
                    "-- km/h";

                error.textContent =
                    "Please enter a valid city.";

            }


            finally {

                loading.style.display = "none";

            }

        }


        /* =========================
           SEARCH
        ========================= */

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const cityName =
                    cityInput.value.trim();


                if (cityName === "") {

                    error.textContent =
                        "Please enter a city.";

                    return;

                }


                getWeather(cityName);

            }
        );


        /* DEFAULT CITY */

        getWeather("Mekelle");

    </script>

</body>

</html>
